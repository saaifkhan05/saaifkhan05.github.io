<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup 9B · Dual Lens (SE / AE)</title>
<style>
/* ROUGH DRAFT — feature mockup only. One content set, two orderings and
   two emphasis lines. The lens changes what surfaces first and which
   metric leads; nothing is hidden, only re-weighted. */
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#161616;--surface:#1f1f1f;--line:#393939;--text:#f4f4f4;--dim:#a8a8a8;--blue:#78a9ff;--blue-d:#0f62fe;--green:#42be65}
body{background:var(--bg);color:var(--text);font:14px/1.5 'IBM Plex Sans',system-ui,sans-serif;padding:40px 20px 80px}
.wrap{max-width:760px;margin:0 auto}
.note{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-bottom:26px}
.note b{color:var(--blue)}

/* lens switch */
.switch{display:flex;border:1px solid var(--line);width:max-content;margin-bottom:10px}
.switch button{background:none;border:0;color:var(--dim);padding:12px 22px;font:600 13px 'IBM Plex Sans',sans-serif;cursor:pointer;letter-spacing:.04em;border-right:1px solid var(--line)}
.switch button:last-child{border-right:0}
.switch button.on{background:var(--blue-d);color:#fff}
#lensline{color:var(--dim);font-size:13px;min-height:20px;margin-bottom:30px;transition:opacity .3s}

h1{font-weight:300;font-size:40px;letter-spacing:-.03em;margin-bottom:6px}
h1 i{color:var(--blue);font-style:normal}
.g{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:34px 0 12px}

/* cards re-order via flex `order`; a brief fade covers the jump */
.list{display:flex;flex-direction:column;gap:10px;transition:opacity .25s}
.list.swap{opacity:0}
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);padding:18px 22px;display:grid;grid-template-columns:1fr auto;gap:2px 16px;transition:border-color .3s}
.card.lead{border-left-color:var(--blue-d)}
.card .n{font-weight:600;font-size:15px}
.card .s{color:var(--dim);font-size:12.5px;grid-column:1}
.card .hook{grid-column:1;font-size:13px;color:var(--text);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.card .hook b{color:var(--blue)}
.badge{grid-row:1/span 2;align-self:center;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green);border:1px solid var(--green);padding:4px 8px;height:max-content;opacity:0;transition:opacity .3s}
.card.lead .badge{opacity:1}
</style>
</head>
<body>
<div class="wrap">
<div class="note">Mockup 9B · <b>Dual lens</b> · rough draft — toggle re-weights the same content</div>

<h1>Saaif Khan<i>.</i></h1>
<div class="switch">
  <button id="b-se" class="on" onclick="setLens('se')">Hiring an SE?</button>
  <button id="b-ae" onclick="setLens('ae')">Hiring an AE?</button>
</div>
<div id="lensline"></div>

<div class="g">Roles</div>
<div class="list" id="roles"></div>
<div class="g">Projects</div>
<div class="list" id="projects"></div>
</div>

<script>
/* Every entry has one neutral sub-line plus a hook per lens.
   `se`/`ae` numbers are sort priority (lower = higher on the page). */
const ROLES=[
 {n:'IBM — Brand Sales Specialist',s:'New York, NY · May 2026 – Present · Internship',
  se:3,ae:1,seHook:'Built <b>financial models &amp; BVAs</b> that turned tech into ROI rooms.',aeHook:'Advanced <b>6 active opportunities</b> across a 150+ agency account.'},
 {n:'Workiva — Sales Engineer Enablement',s:'Dallas, TX · Jan – Jun 2026 · Internship',
  se:1,ae:3,seHook:'Redesigned the platform serving <b>230+ SEs</b>; demoed V2 to 90+ of them.',aeHook:'Built the <b>business case</b> that got a global redesign funded.'},
 {n:'Cisco (Splunk) — Solutions Engineer',s:'Boulder, CO · May – Aug 2025 · Internship',
  se:2,ae:2,seHook:'Live-demoed an <b>89%-accurate ML model</b> to 30+ senior leaders.',aeHook:'Pattern-matched <b>60+ discovery calls</b> into $1M+ of pipeline.'},
 {n:'U.S. Renal Care — AI Solutions Consultant',s:'Plano, TX · Aug – Dec 2025 · Contract',
  se:4,ae:4,seHook:'Drove <b>Copilot adoption</b> where the blocker was people, not tech.',aeHook:'Sold change internally — <b>adoption is a sales problem</b>.'},
 {n:'eBay — Founder & Business Owner',s:'Dallas, TX · Aug 2023 – Aug 2025',
  se:5,ae:5,seHook:'Ran the whole stack solo: sourcing, listing, ops, support.',aeHook:'Built a book of business from zero — <b>own P&amp;L, own quota</b>.'},
];
const PROJECTS=[
 {n:'KDR Generator',s:'IBM · AI close-plan engine',
  se:1,ae:2,seHook:'Full-stack build: <b>LLM pipeline</b> inside the seller workflow.',aeHook:'Close plans in <b>minutes, not hours</b> — more at-bats per week.'},
 {n:'SE Highspot V2',s:'Workiva · enablement platform redesign',
  se:2,ae:4,seHook:'<b>18-page IA</b>, tagging taxonomy, governance for 259 assets.',aeHook:'Enablement that sellers <b>actually open</b>.'},
 {n:'FlightFlow',s:'Splunk · flight delay intelligence',
  se:3,ae:3,seHook:'Splunk MLTK · <b>89% accuracy</b> · alerting pipeline.',aeHook:'Demo that put an <b>unconsidered AI use case</b> in front of directors.'},
 {n:'U.S. Food Access Risk',s:'Splunk · county-level risk model',
  se:4,ae:5,seHook:'USDA data joined &amp; modeled at <b>county grain</b>.',aeHook:'Data storytelling for a <b>non-technical audience</b>.'},
 {n:'Valor',s:'IBM watsonx · Bank of America case study',
  se:5,ae:1,seHook:'watsonx architecture grounded in a real bank workflow.',aeHook:'A <b>full pursuit narrative</b>: discovery → value case → pitch.'},
];
const LINES={se:'Lens: Sales Engineering — technical builds, demos, and enablement first.',
             ae:'Lens: Account Executive — pipeline, territory, and revenue first.'};

function card(d){
  return `<div class="card" data-se="${d.se}" data-ae="${d.ae}">
    <div class="n">${d.n}</div><span class="badge">Top for this lens</span>
    <div class="s">${d.s}</div>
    <div class="hook" data-sehook="${d.seHook.replace(/"/g,'&quot;')}" data-aehook="${d.aeHook.replace(/"/g,'&quot;')}"></div></div>`;
}
document.getElementById('roles').innerHTML=ROLES.map(card).join('');
document.getElementById('projects').innerHTML=PROJECTS.map(card).join('');

let lens=null;
function setLens(l){
  if(l===lens)return;lens=l;
  document.getElementById('b-se').classList.toggle('on',l==='se');
  document.getElementById('b-ae').classList.toggle('on',l==='ae');
  const ll=document.getElementById('lensline');
  ll.style.opacity=0;
  setTimeout(()=>{ll.textContent=LINES[l];ll.style.opacity=1},250);
  document.querySelectorAll('.list').forEach(list=>{
    list.classList.add('swap');
    setTimeout(()=>{
      [...list.children].forEach(c=>{
        c.style.order=c.dataset[l];
        c.classList.toggle('lead',c.dataset[l]==='1');
        const h=c.querySelector('.hook');h.innerHTML=h.dataset[l+'hook'];
      });
      list.classList.remove('swap');
    },250);
  });
}
setLens('se');
</script>
</body>
</html>
